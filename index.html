<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISN · Supernova Booklet</title><meta name="description" content="Turn the pages of the ISN Supernova booklet and discover our performances."><link rel="stylesheet" href="style.css?v=20261021"></head><body>
<main class="reader" aria-label="ISN digital booklet">
<div class="book-top"><span>ISN · SUPERNOVA</span><button id="contents-open" aria-haspopup="dialog">Contents ☰</button></div>
<div id="paper" aria-label="Booklet page"><div id="sheet"><img id="page-image" class="page-art" src="assets/page-1.jpg?v=20261021" alt="ISN Supernova cover" draggable="false">
<section id="gallery" class="gallery-page" hidden><div class="gallery-heading"><h1>THE<br>PERFORMANCES</h1><p class="hint">Swipe the cards · Tap to discover</p></div><div id="orbit" class="orbit-stage" aria-label="Performance carousel"><div class="orbit-line"></div><div id="cards"></div></div><div class="rotation"><button id="rotate-left" aria-label="Previous performance">←</button><span id="selection" aria-live="polite"></span><button id="rotate-right" aria-label="Next performance">→</button></div><button id="open-detail" class="primary">Explore performance ↗</button><p class="pending">Programme details to be confirmed</p></section>
</div><button class="page-corner corner-prev" id="corner-prev" aria-label="Turn to previous page"></button><button class="page-corner corner-next" id="corner-next" aria-label="Turn to next page"></button></div>
<div class="paging"><button id="previous" aria-label="Previous booklet page">←</button><div class="page-status" aria-live="polite"><span id="label">Cover</span><span id="count">01 / 18</span></div><button id="next" aria-label="Next booklet page">→</button></div>
<p class="reading-hint">Swipe or tap the page corners to turn</p>
</main>
<dialog id="contents" aria-labelledby="contents-title"><div class="dialog-heading"><h2 id="contents-title">In this booklet</h2><button id="contents-close" aria-label="Close contents">✕</button></div><nav aria-label="Booklet contents"><button data-section="0"><span>01</span>Cover</button><button data-section="1"><span>02</span>About ISN</button><button data-section="2" data-end="9"><span>03–10</span>Our communities</button><button data-section="10"><span>11</span>Performances</button><button data-section="11" data-end="15"><span>12–16</span>Behind the Scenes & Interviews</button><button data-section="16"><span>17</span>Facebook</button><button data-section="17"><span>18</span>Feedback</button></nav></dialog>
